    <!-- 3D 天球：fixed 全屏，章节内容层之下 -->

    <div id="loading">星 空 加 载 中 …</div>

    <!-- 降级页：WebGL 不可用时由 app.ts 激活 -->
    <div id="fallback" hidden>
      <div class="fallback-inner">
        <h1>步天歌</h1>
        <p class="fallback-lead">这是一幅可以走上去的中国星空——三千年前中国人为星星命名的交互星图。</p>
        <p>很抱歉，你当前的浏览器环境无法创建 WebGL 绘图上下文，交互星图无法呈现。可能原因：浏览器开启了反追踪/指纹防护、设备内存不足，或浏览器版本过旧。请换用最新版 Chrome、Edge、Firefox 或 Safari 访问。</p>
        <p>本站内容包括：三垣四象二十八宿星官体系的动态点亮、登封观星台圭表测影模型、紫微垣天人秩序巡游，以及中国星官与西方星座的同天对比。</p>
        <p id="fallback-diag"></p>
        <p class="fallback-credits">数据：HYG Database v4.4 · Stellarium 中国星空文化数据 · 《步天歌》</p>
      </div>
    </div>

    <!-- 八章滚动叙事：每章一个 100vh sticky pin 容器，章内 DOM 由章节模块自建 -->

      <!-- 六、一万年 -->
      <section id="ch6" class="chapter"><div class="pin"></div></section>
      <!-- 七、东西对话 -->
      <section id="ch7" class="chapter"><div class="pin"></div></section>
